flyer:
  rules: |
    __****Community Guidelines****__
    ```markdown
    1. Respect all members. Harassment, discrimination, hate speech, or offensive behavior is prohibited.
    2. No spam, flooding, excessive emojis, or unsolicited DMs.
    3. Keep content appropriate. NSFW, explicit, or adult material is not allowed.
    4. No bullying, personal attacks, or targeted harassment.
    5. Respect privacy. Do not share personal or confidential information without permission.
    6. Follow Discord's Community Guidelines and Terms of Service.
    7. Advertising or self-promotion requires moderator approval unless allowed in designated channels.
    8. Use appropriate language and maintain a welcoming environment.
    9. Stay on topic and use channels for their intended purpose.
    ```
    __****Penalty System****__
    ```markdown
    1 Violation = Written Warning
    3 Violations = 3-Day Mute
    Kick/Ban = Moderator Discretion
    ```
    __****Enforcement Policy****__
    ```markdown
    Members who continue to break the rules after receiving three warnings will be muted for 3 days. Repeated violations after a mute may result in a kick or permanent ban from the Qubiverse Discord server.
    ```